<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Kamera 2 - Live Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

    <style>
        :root {
            --bg-base: #06090e;
            --border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00f2fe;
            --accent-emerald: #10b981;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-base);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .top-bar {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
        }

        .cam-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-emerald);
            box-shadow: 0 0 10px var(--accent-emerald);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .nav-back {
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .nav-back:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .osd-hud {
            position: absolute;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .hud-pill {
            background: rgba(0,0,0,0.65);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rec {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 6px var(--accent-red);
        }

        .bottom-bar {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .status-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0,242,254,0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="top-bar">
            <div class="cam-badge">
                <span class="dot" id="cam-dot"></span>
                <span>Kamera 2 - Feed Langsung</span>
            </div>
            <a href="../index.html" class="nav-back">
                &larr; Kembali ke Dashboard CCTV
            </a>
        </div>

        <div class="video-box" id="video-wrapper">
            <video id="cctv-player" autoplay muted playsinline controls></video>

            <div class="osd-hud">
                <div class="hud-pill">
                    <span class="rec"></span>
                    <span>CAM-02 (LIVE)</span>
                </div>
                <div class="hud-pill" id="hud-clock">
                    --:--:--
                </div>
            </div>

            <div class="status-overlay" id="loading-overlay">
                <div class="spinner"></div>
                <span id="loading-text">Menghubungkan ke index.m3u8...</span>
            </div>
        </div>

        <div class="bottom-bar">
            <div id="meta-info">File: index.m3u8</div>
            <div class="btn-group">
                <button class="btn" onclick="toggleMute()">🔊 Unmute</button>
                <button class="btn" onclick="captureSnapshot()">📸 Screenshot</button>
                <button class="btn" onclick="reloadFeed()">🔄 Reload</button>
                <button class="btn" onclick="toggleFull()">⛶ Fullscreen</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('cctv-player');
        const overlay = document.getElementById('loading-overlay');
        const loadText = document.getElementById('loading-text');
        const hudClock = document.getElementById('hud-clock');
        const metaInfo = document.getElementById('meta-info');
        const streamUrl = 'index.m3u8';
        let hls = null;

        function updateClock() {
            const now = new Date();
            hudClock.innerText = now.toLocaleTimeString('id-ID', { hour12: false }) + ' WIB';
        }
        setInterval(updateClock, 1000);
        updateClock();

        function startStream() {
            overlay.style.display = 'flex';
            loadText.innerText = 'Menghubungkan ke ' + streamUrl + '...';

            if (hls) {
                hls.destroy();
                hls = null;
            }

            video.onloadedmetadata = () => {
                metaInfo.innerText = `Resolusi: ${video.videoWidth}x${video.videoHeight} • Live HLS`;
            };

            video.onplaying = () => {
                overlay.style.display = 'none';
            };

            // 1. Utamakan Hls.js untuk browser desktop (Chrome, Firefox, Edge, Opera)
            if (window.Hls && Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    liveSyncDurationCount: 3,
                    maxBufferLength: 8
                });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log('Autoplay info:', e));
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.details === 'fragParsingError') {
                        overlay.style.display = 'flex';
                        loadText.innerHTML = '<span style="color: #ef4444; font-weight: bold;">Error: fragParsingError</span><br>Kamera menggunakan codec H.265 (HEVC). Browser butuh H.264.';
                        return;
                    }
                    if (data.fatal) {
                        loadText.innerText = 'Stream belum tersedia atau terputus. Mencoba reconnect...';
                        setTimeout(() => {
                            if (hls) hls.startLoad();
                        }, 3000);
                    }
                });
            }
            // 2. Fallback native HLS (Safari iOS / macOS)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(() => {});
                }, { once: true });
                video.play().catch(() => {});
            }
        }

        function reloadFeed() {
            startStream();
        }

        function toggleMute() {
            video.muted = !video.muted;
        }

        function captureSnapshot() {
            if (video.readyState < 2) return;
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const a = document.createElement('a');
            a.download = `kamera2-${Date.now()}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
        }

        function toggleFull() {
            const w = document.getElementById('video-wrapper');
            if (!document.fullscreenElement) {
                if (w.requestFullscreen) w.requestFullscreen();
                else if (w.webkitRequestFullscreen) w.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        document.addEventListener('DOMContentLoaded', startStream);
    </script>
</body>

</html>
